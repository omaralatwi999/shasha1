            paintTf();showOv('ovTime',$('f_h'))}
          function adj(k,dir){
            var f=FL.filter(function(x){return x[0]===k})[0],mx=(k==='d')?dim(TF.y,TF.mo):f[3],v=TF[k]+dir;
            if(v>mx)v=f[2];if(v<f[2])v=mx;
            TF[k]=v;
            var md=dim(TF.y,TF.mo);if(TF.d>md)TF.d=md;
            paintTf()}
          function saveTime(){
            var ms=Date.UTC(TF.y,TF.mo-1,TF.d,TF.h,TF.mi,0)-TZOFF;
            OFF=ms-Date.now();manual=true;saveClock();curDay='';closeOv();tick()}

          /* ================== النوافذ + التنقل بالريموت ================== */
          var openOvEl=null;
          function showOv(id,focusEl){openOvEl=$(id);openOvEl.classList.add('show');if(focusEl)focusEl.focus()}
          function closeOv(){
            if(!openOvEl)return false;
            openOvEl.classList.remove('show');openOvEl=null;
            var t=lastTile&&document.body.contains(lastTile)?lastTile:$('apps').firstChild;
            if(t)t.focus();return true}
          function onBackKey(){closeOv();return true}
          function goHome(){closeOv();var f=$('apps').firstChild;if(f)f.focus()}
          function layerItems(){
            var root=openOvEl||$('apps');
            return[].slice.call(root.querySelectorAll('[data-f]'))}
          function go(e){e.focus({preventScroll:true});if(openOvEl&&openOvEl.id==='ovApps')e.scrollIntoView({block:'nearest'})}
          function move(dir){
            var els=layerItems();if(!els.length)return;
            var c=document.activeElement,ix=els.indexOf(c);
            if(ix<0){els[0].focus();return}
            /* تنقل فوري بالحساب بدل قياس كل العناصر (الواجهة من اليمين لليسار) */
            var id=openOvEl?openOvEl.id:'dock',cols=id==='ovApps'?7:(id==='dock'||id==='ovTime')?els.length:0;
            if(cols){
              var j=ix+(dir==='L'?1:dir==='R'?-1:dir==='D'?cols:-cols);
              if(j>=0&&j<els.length&&!((dir==='L'||dir==='R')&&Math.floor(j/cols)!==Math.floor(ix/cols)))go(els[j]);
              else if(dir==='D'&&id==='ovApps'&&Math.floor(ix/cols)<Math.floor((els.length-1)/cols))go(els[els.length-1]);
              return}
            var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
            els.forEach(function(e){
              if(e===c)return;
              var q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,main,cross;
              if(dir==='L'){main=-dx;cross=Math.abs(dy)}else if(dir==='R'){main=dx;cross=Math.abs(dy)}
              else if(dir==='U'){main=-dy;cross=Math.abs(dx)}else{main=dy;cross=Math.abs(dx)}
              if(main<=2)return;
              var sc=main+cross*3;if(sc<bs){bs=sc;best=e}});
            if(best)best.focus()}
          document.addEventListener('keydown',function(e){
            var k=e.key,c=e.keyCode,d=null;
            if(k==='ArrowLeft'||c===21)d='L';else if(k==='ArrowRight'||c===22)d='R';
            else if(k==='ArrowUp'||c===19)d='U';else if(k==='ArrowDown'||c===20)d='D';
            if(d){
              var a0=document.activeElement;
              if((d==='U'||d==='D')&&openOvEl&&openOvEl.id==='ovTime'&&a0&&a0.getAttribute&&a0.getAttribute('data-k')){
                e.preventDefault();adj(a0.getAttribute('data-k'),d==='U'?1:-1);return}
              e.preventDefault();move(d);return}
            if(k==='Enter'||c===13||c===23||c===66){
              var a=document.activeElement;
              if(a&&a.getAttribute&&a.getAttribute('data-f')){e.preventDefault();a.click()}return}
            if(k==='Escape'||k==='Backspace'||k==='GoBack'){e.preventDefault();onBackKey()}});
          document.addEventListener('focusout',function(){
            setTimeout(function(){
              if(document.activeElement===document.body||!document.activeElement){
                var els=layerItems();if(els.length)els[0].focus()}},50)});

          /* ================== تشغيل ================== */
          buildDock();
          var f0=$('apps').firstChild;if(f0)f0.focus();
          tick();
          startBg();syncTime();prayer();weather();
          setInterval(tick,1000);setInterval(prayer,36e5);setInterval(weather,9e5);setInterval(syncTime,6e5);
          /* تجهيز شبكة التطبيقات في وقت الفراغ لتفتح فوراً */
          setTimeout(function(){if(!appsBuilt)buildApps()},3000);
          </script></body></html>
