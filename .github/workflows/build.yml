name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/om/shasha app/src/main/assets app/src/main/res/drawable app/src/main/assets/logos
          if [ -d logos ]; then cp -r logos/. app/src/main/assets/logos/; fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.om.shasha'
            compileSdk 34
            defaultConfig { applicationId 'com.om.shasha'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:startColor="#2B3A67" android:endColor="#6B4E7E" android:angle="315"/>
          </shape>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
            </queries>
            <application android:label="شاشة" android:icon="@drawable/banner" android:banner="@drawable/banner" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                android:screenOrientation="landscape"
                android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode|screenLayout|smallestScreenSize|density|locale|layoutDirection">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/om/shasha/MainActivity.java <<'EOF'
          package com.om.shasha;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.IntentFilter;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.AdaptiveIconDrawable;
          import android.graphics.drawable.Drawable;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.LruCache;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            WebView web;
            final LruCache<String, byte[]> iconCache = new LruCache<String, byte[]>(200);
            /* كاش لقائمة التطبيقات: تُقرأ مرة واحدة وتُحدّث فقط عند تثبيت/حذف تطبيق */
            volatile List<String[]> appCache = null;   /* {pkg, label, activity, labelLower} */
            volatile boolean pkgDirty = false;
            synchronized List<String[]> allApps() {
              List<String[]> c = appCache;
              if (c != null) return c;
              PackageManager pm = getPackageManager();
              Map<String, String[]> found = new HashMap<String, String[]>();
              List<String> order = new ArrayList<String>();
              String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
              for (String cat : cats) {
                Intent m = new Intent(Intent.ACTION_MAIN);
                m.addCategory(cat);
                for (ResolveInfo r : pm.queryIntentActivities(m, 0)) {
                  String p = r.activityInfo.packageName;
                  if (p.equals(getPackageName()) || found.containsKey(p)) continue;
                  String lb = r.loadLabel(pm).toString();
                  found.put(p, new String[]{p, lb, r.activityInfo.name, lb.toLowerCase()});
                  order.add(p);
                }
              }
              List<String[]> list = new ArrayList<String[]>();
              for (String p : order) list.add(found.get(p));
              appCache = list;
              return list;
            }

            /* ---------- البحث عن تطبيق بالاسم ---------- */
            String[] find(String q) {
              String[] keys = q.toLowerCase().split("\\|");
              for (String[] a : allApps()) {
                for (String k : keys) {
                  if (k.length() > 0 && a[3].contains(k)) return a;
                }
              }
              return null;
            }

            Intent launchIntentFor(String pkg) {
              PackageManager pm = getPackageManager();
              Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
              if (i == null) i = pm.getLaunchIntentForPackage(pkg);
              return i;
            }

            /* ---------- رسم أيقونة التطبيق (مربعة بدون قناع) ---------- */
            byte[] iconBytes(String pkg) {
              byte[] cached = iconCache.get(pkg);
              if (cached != null) return cached;
              try {
                PackageManager pm = getPackageManager();
                Drawable d = pm.getApplicationIcon(pkg);
                int s = 160;
                Bitmap bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                Canvas c = new Canvas(bm);
                if (Build.VERSION.SDK_INT >= 26 && d instanceof AdaptiveIconDrawable) {
                  AdaptiveIconDrawable ad = (AdaptiveIconDrawable) d;
                  int o = s / 4;
                  Drawable bg = ad.getBackground();
                  Drawable fg = ad.getForeground();
                  if (bg != null) { bg.setBounds(-o, -o, s + o, s + o); bg.draw(c); }
                  if (fg != null) { fg.setBounds(-o, -o, s + o, s + o); fg.draw(c); }
                } else {
                  d.setBounds(0, 0, s, s);
                  d.draw(c);
                }
                ByteArrayOutputStream out = new ByteArrayOutputStream();
                bm.compress(Bitmap.CompressFormat.PNG, 100, out);
                byte[] b = out.toByteArray();
                iconCache.put(pkg, b);
                return b;
              } catch (Throwable e) {
                return null;
              }
            }

            /* ---------- الجسر بين الواجهة وأندرويد ---------- */
            class Bridge {
              /* يرجّع اسم الحزمة إن كان التطبيق مثبتاً، وإلا نص فارغ */
              @JavascriptInterface
              public String resolve(String q) {
                try {
                  if (q.startsWith("pkg:")) {
                    String p = q.substring(4);
                    return launchIntentFor(p) != null ? p : "";
                  }
                  if (q.startsWith("name:")) {
                    String[] r = find(q.substring(5));
                    return r != null ? r[0] : "";
                  }
                } catch (Throwable e) { }
                return "";
              }

              /* قائمة كل التطبيقات */
              @JavascriptInterface
              public String apps() {
                JSONArray arr = new JSONArray();
                try {
                  List<String[]> list = new ArrayList<String[]>(allApps());
                  Collections.sort(list, new Comparator<String[]>() {
                    public int compare(String[] a, String[] b) { return a[1].compareToIgnoreCase(b[1]); }
                  });
                  for (String[] e : list) {
                    JSONObject o = new JSONObject();
                    o.put("pkg", e[0]);
                    o.put("label", e[1]);
                    arr.put(o);
                  }
                } catch (Throwable e) { }
                return arr.toString();
              }

              /* منافذ HDMI */
              @JavascriptInterface
              public String inputs() {
                JSONArray arr = new JSONArray();
                try {
                  TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                  List<JSONObject> rows = new ArrayList<JSONObject>();
                  Set<String> seen = new HashSet<String>();
                  for (TvInputInfo t : tm.getTvInputList()) {
                    if (t.getType() != TvInputInfo.TYPE_HDMI) continue;
                    if (!seen.add(t.getId())) continue;
                    JSONObject o = new JSONObject();
                    String label = "";
                    try { CharSequence cl = t.loadLabel(MainActivity.this); if (cl != null) label = cl.toString(); } catch (Throwable e) { }
                    int port = 0;
                    String device = "";
                    try {
                      Object h = t.getClass().getMethod("getHdmiDeviceInfo").invoke(t);
                      if (h != null) {
                        port = ((Integer) h.getClass().getMethod("getPortId").invoke(h)).intValue();
                        Object dn = h.getClass().getMethod("getDisplayName").invoke(h);
                        if (dn != null && dn.toString().length() > 0) device = dn.toString();
                      }
                    } catch (Throwable e) { }
                    if (label.length() == 0) label = "HDMI " + (port > 0 ? port : (rows.size() + 1));
                    boolean connected = true;
                    try { connected = tm.getInputState(t.getId()) != TvInputManager.INPUT_STATE_DISCONNECTED; } catch (Throwable e) { }
                    o.put("id", t.getId());
                    o.put("label", label);
                    o.put("device", device);
                    o.put("port", port);
                    o.put("connected", connected);
                    rows.add(o);
                  }
                  Collections.sort(rows, new Comparator<JSONObject>() {
                    public int compare(JSONObject a, JSONObject b) {
                      int d = a.optInt("port") - b.optInt("port");
                      return d != 0 ? d : a.optString("label").compareTo(b.optString("label"));
                    }
                  });
                  for (JSONObject o : rows) arr.put(o);
                } catch (Throwable e) { }
                return arr.toString();
              }

              @JavascriptInterface
              public void launch(final String q) {
                runOnUiThread(new Runnable() { public void run() {
                  try {
                    Intent i = null;
                    if (q.equals("settings")) i = new Intent(Settings.ACTION_SETTINGS);
                    else if (q.startsWith("input:")) i = new Intent(Intent.ACTION_VIEW, TvContract.buildChannelUriForPassthroughInput(q.substring(6)));
                    else if (q.startsWith("pkg:")) i = launchIntentFor(q.substring(4));
                    else if (q.startsWith("name:")) {
                      String[] r = find(q.substring(5));
                      if (r != null) {
                        i = new Intent(Intent.ACTION_MAIN);
                        i.setClassName(r[0], r[2]);
                      }
                    }
                    if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      overridePendingTransition(0, 0);
                    } else Toast.makeText(MainActivity.this, "غير موجود", Toast.LENGTH_SHORT).show();
                  } catch (Throwable e) {
                    Toast.makeText(MainActivity.this, "تعذر الفتح", Toast.LENGTH_SHORT).show();
                  }
                }});
              }
            }

            void js(final String code) {
              runOnUiThread(new Runnable() { public void run() {
                if (web != null) web.evaluateJavascript(code, null);
              }});
            }

            void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setMediaPlaybackRequiresUserGesture(false);
              if (Build.VERSION.SDK_INT >= 23) s.setOffscreenPreRaster(true);
              web.setBackgroundColor(0xFF0B0F1A);
              web.setOverScrollMode(View.OVER_SCROLL_NEVER);
              web.setVerticalScrollBarEnabled(false);
              web.setHorizontalScrollBarEnabled(false);
              /* تحديث الكاش فقط عند تثبيت أو حذف تطبيق */
              IntentFilter pf = new IntentFilter();
              pf.addAction(Intent.ACTION_PACKAGE_ADDED);
              pf.addAction(Intent.ACTION_PACKAGE_REMOVED);
              pf.addAction(Intent.ACTION_PACKAGE_CHANGED);
              pf.addDataScheme("package");
              registerReceiver(new BroadcastReceiver() {
                @Override public void onReceive(Context c, Intent i) {
                  appCache = null; iconCache.evictAll(); pkgDirty = true;
                }
              }, pf);
              web.addJavascriptInterface(new Bridge(), "Android");
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (u != null && "icons.local".equals(u.getHost())) {
                    Map<String, String> h = new HashMap<String, String>();
                    h.put("Access-Control-Allow-Origin", "*");
                    h.put("Cache-Control", "max-age=86400");
                    String pkg = u.getLastPathSegment();
                    byte[] png = pkg == null ? null : iconBytes(pkg);
                    if (png != null) return new WebResourceResponse("image/png", null, 200, "OK", h, new ByteArrayInputStream(png));
                    return new WebResourceResponse("image/png", null, 404, "Not Found", h, new ByteArrayInputStream(new byte[0]));
                  }
                  return null;
                }
              });
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
              immersive();
            }

            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) immersive();
            }

            @Override protected void onResume() {
              super.onResume();
              if (pkgDirty) { pkgDirty = false; js("window.refreshDock&&refreshDock()"); }
            }

            @Override protected void onNewIntent(Intent i) {
              super.onNewIntent(i);
              js("window.goHome&&goHome()");
            }

            @Override public void onBackPressed() {
              js("window.onBackKey&&onBackKey()");
            }
          }
          EOF
          cat > app/src/main/java/com/om/shasha/BootReceiver.java <<'EOF'
          package com.om.shasha;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try {
                Intent l = new Intent(c, MainActivity.class);
                l.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(l);
              } catch (Throwable e) { }
            }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>شاشة</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          html,body{height:100%;overflow:hidden;background:#0b0f1a;color:#fff;font-family:'Noto Sans Arabic','Noto Naskh Arabic','Roboto',sans-serif;-webkit-font-smoothing:antialiased}
          button{font-family:inherit;color:inherit}

          /* ===== الخلفيات (صور حقيقية 4K) ===== */
          #bg{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(120% 120% at 70% 20%,#27406b,#0b0f1a 70%)}
          .bgl{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;transform:translateZ(0)}
          .bgl.on{opacity:1}
          .shade{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;background:
           linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 26%),
           linear-gradient(0deg,rgba(0,0,0,.62) 0,rgba(0,0,0,.18) 34%,rgba(0,0,0,0) 56%)}
          #credit{position:fixed;left:1.4vw;bottom:.6vw;font-size:.9vw;opacity:.55;direction:ltr;text-shadow:0 1px 3px rgba(0,0,0,.7)}

          /* ===== زجاج ===== */
          /* زجاج خفيف: بدون blur (أثقل شيء على معالج التلفاز) */
          .glass{background:linear-gradient(145deg,rgba(40,48,70,.62),rgba(15,20,34,.55));
           border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

          /* ===== التخطيط ===== */
          .page{position:fixed;top:0;left:0;right:0;bottom:0;padding:2.2vw 4vw 2vw;display:flex;flex-direction:column;justify-content:space-between}
          .top,.mid{display:flex;justify-content:space-between}
          .top{align-items:flex-start}
          .mid{align-items:center}
          .sm{font-size:1.55vw;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.55)}
          .big{font-size:2.8vw;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.5)}
          #hj{font-size:2.5vw;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.55)}
          #hello{font-size:1.5vw;opacity:.85;margin-top:.3vw;text-shadow:0 1px 8px rgba(0,0,0,.55)}
          .wx{text-align:left;direction:rtl}
          #temp{font-size:4.4vw;font-weight:700;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.5)}
          .clock{text-align:center}
          #time{font-size:12.5vw;font-weight:700;line-height:1;letter-spacing:-.2vw;text-shadow:0 .4vw 3vw rgba(0,0,0,.5)}
          #ampm{font-size:3vw;margin-top:-.4vw;text-shadow:0 2px 12px rgba(0,0,0,.5)}
          #tsrc{font-size:1.25vw;margin-top:.4vw;color:#ffd27a;text-shadow:0 1px 6px rgba(0,0,0,.8)}
          .card{width:33vw;border-radius:2.2vw;padding:1.8vw 2vw}
          #ayah{font-size:2.3vw;line-height:1.9;margin:.8vw 0;font-family:'Noto Naskh Arabic','Amiri',serif}

          /* شريط الصلاة */
          .strip{display:flex;align-items:center;justify-content:space-between;border-radius:2.4vw;padding:.9vw 2.2vw;margin:0 auto 1.4vw;width:92vw}
          .pr{display:flex}.pr .pt{margin:0 .4vw}
          .pt{text-align:center;padding:.35vw 1vw;border-radius:1.2vw;font-size:1.55vw;min-width:7vw}
          .pt .sm{font-size:1.25vw}
          .pt.on{background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
          #nx .big{font-size:2.4vw}
          #ram{text-align:center}
          #ram .big{font-size:2.4vw}

          /* ===== الدوك (أيقونات زجاجية بأسلوب الآيفون) ===== */
          .dockwrap{display:flex;justify-content:center;padding-bottom:.4vw}
          .dock{display:flex;align-items:flex-start;padding:1.1vw 1.5vw .8vw;border-radius:3.4vw}
          #apps{outline:none}
          .t{background:none;border:none;display:flex;flex-direction:column;align-items:center;width:8.2vw;margin:0 .6vw;cursor:pointer;transition:transform .12s ease-out;outline:none;position:relative;will-change:transform}
          .ic{position:relative;width:7.2vw;height:7.2vw;border-radius:1.75vw;display:flex;align-items:center;justify-content:center;overflow:hidden;
           background:linear-gradient(150deg,rgba(255,255,255,.3),rgba(255,255,255,.1));
           border:.18vw solid rgba(255,255,255,.4)}
          .ic img{width:74%;height:74%;border-radius:20%;object-fit:cover}
          .ic svg{width:52%;height:52%}
          .ic .ch{font-size:3.4vw;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.4)}
          .lb{margin-top:.55vw;font-size:1.32vw;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.75);white-space:nowrap;max-width:8.2vw;overflow:hidden;text-overflow:ellipsis}
          .t.off .ic{opacity:.4}
          .t:focus{transform:translateY(-.9vw) scale(1.18);z-index:2}
          .t:focus .ic{border-color:#fff;background:rgba(255,255,255,.42)}
          .t:focus .lb{font-weight:700}

          /* ===== النوافذ المنبثقة (HDMI + التطبيقات + الوقت) ===== */
          .ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,.8)}
          .ov.show{display:flex;animation:fi .12s ease-out}
          @keyframes fi{from{opacity:0}to{opacity:1}}
          .ov .glass{background:rgba(22,28,44,.96)}
          .sheet{border-radius:3vw;padding:2.4vw 3vw;max-width:88vw;max-height:84vh;display:flex;flex-direction:column}
          .sheet h2{font-size:2.6vw;font-weight:700;text-align:center}
          .sheet p{font-size:1.4vw;opacity:.8;text-align:center;margin:.4vw 0 1.8vw}
          .ports{display:flex;flex-wrap:wrap;justify-content:center}
          .pc{width:17vw;border-radius:2vw;padding:1.5vw 1vw 1.2vw;background:linear-gradient(150deg,rgba(255,255,255,.3),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.4);
           display:flex;flex-direction:column;align-items:center;margin:.8vw;cursor:pointer;outline:none;transition:transform .12s ease-out}.pc>*{margin-top:.5vw}
          .pc svg{width:5vw;height:5vw}
          .pc .nm{font-size:1.9vw;font-weight:700}
          .pc .dv{font-size:1.2vw;opacity:.8;min-height:1.6vw}
          .pc .st{display:flex;align-items:center;font-size:1.2vw;opacity:.95}
          .pc .dot{margin-left:.5vw;width:.8vw;height:.8vw;border-radius:50%;background:#7a8499}
          .pc.on .dot{background:#46e37e;box-shadow:0 0 .8vw #46e37e}
          .pc:focus{transform:scale(1.08);border-color:#fff;box-shadow:0 0 0 .26vw #fff}
          .hint{font-size:1.2vw;opacity:.65;text-align:center;margin-top:1.6vw}
