              $('liveBtn').onclick=function(){closeOv();L('name:تلفزيون مباشر|live tv|live channels|tv')}}
            else list.forEach(function(p){
              var c=document.createElement('button');c.className='pc'+(p.connected?' on':'');c.setAttribute('data-f','1');
              c.innerHTML=PORT_SVG+'<div class="nm">'+esc(p.label)+'</div><div class="dv">'+esc(p.device||'')+'</div><div class="st"><span class="dot"></span>'+(p.connected?'متصل':'غير متصل')+'</div>';
              c.onclick=function(){closeOv();L('input:'+p.id)};
              box.appendChild(c)});
            showOv('ovHdmi',box.querySelector('.pc.on')||box.querySelector('[data-f]'))}

          /* ================== كل التطبيقات ================== */
          /* الشبكة تُبنى مرة واحدة فقط ثم تُعاد استخدامها (فتح فوري) */
          var appsBuilt=false;
          function buildApps(){
            var list=[];try{list=JSON.parse(AND?AND.apps():'[]')||[]}catch(e){}
