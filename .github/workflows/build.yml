              var b=mkTile(o,function(){
                if(o.act==='hdmi')openHdmi();else if(o.act==='apps')openApps();else if(o.act==='time')openTime();else L(o.spec)});
              o.el=b;dk.appendChild(b);setTile(b,o)})}
          function refreshDock(){iconVer++;appsBuilt=false;DOCK.forEach(function(o){o.pkg=null;if(o.el)setTile(o.el,o)})}

          /* ================== HDMI ================== */
          var PORT_SVG='<svg viewBox="0 0 24 24"><path d="M3 6.5h18v7.2l-3.2 3.3H15v2H9v-2H6.2L3 13.7z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 10h10M7 12.6h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>';
          function openHdmi(){
