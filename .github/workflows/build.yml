            list.forEach(function(p){
              var b=mkTile({label:p.label},function(){closeOv();L('pkg:'+p.pkg)});
              fillIcon(b.firstChild,p.pkg,p.label);fr.appendChild(b)});
            g.appendChild(fr);appsBuilt=true}
          function openApps(){
            if(!appsBuilt)buildApps();
            var g=$('grid');g.scrollTop=0;
            showOv('ovApps',g.querySelector('[data-f]'))}

          /* ================== ضبط الوقت يدوياً ================== */
          var TF=null;
          var FL=[['y','السنة',2025,2045],['mo','الشهر',1,12],['d','اليوم',1,31],['h','الساعة',0,23],['mi','الدقيقة',0,59]];
          function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
          function paintTf(){FL.forEach(function(f){var k=f[0];$('f_'+k).querySelector('.v').textContent=ar((k==='h'||k==='mi')?z(TF[k]):TF[k])})}
          function openTime(){
