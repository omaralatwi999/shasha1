name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/om/shasha app/src/main/assets app/src/main/res/drawable app/src/main/assets/logos
          if [ -d logos ]; then cp -r logos/. app/src/main/assets/logos/; fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.om.shasha'
            compileSdk 34
            defaultConfig { applicationId 'com.om.shasha'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:startColor="#2B3A67" android:endColor="#6B4E7E" android:angle="315"/>
          </shape>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
            </queries>
            <application android:label="Ø´Ø§Ø´Ø©" android:icon="@drawable/banner" android:banner="@drawable/banner" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                android:screenOrientation="landscape"
                android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode|screenLayout|smallestScreenSize|density|locale|layoutDirection">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/om/shasha/MainActivity.java <<'EOF'
          package com.om.shasha;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.IntentFilter;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.AdaptiveIconDrawable;
          import android.graphics.drawable.Drawable;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.LruCache;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            WebView web;
            final LruCache<String, byte[]> iconCache = new LruCache<String, byte[]>(200);
            /* ÙƒØ§Ø´ Ù„Ù‚Ø§Ø¦Ù…Ø© Ø§Ù„ØªØ·Ø¨ÙŠÙ‚Ø§Øª: ØªÙÙ‚Ø±Ø£ Ù…Ø±Ø© ÙˆØ§Ø­Ø¯Ø© ÙˆØªÙØ­Ø¯Ù‘Ø« ÙÙ‚Ø· Ø¹Ù†Ø¯ ØªØ«Ø¨ÙŠØª/Ø­Ø°Ù ØªØ·Ø¨ÙŠÙ‚ */
            volatile List<String[]> appCache = null;   /* {pkg, label, activity, labelLower} */
            volatile boolean pkgDirty = false;
            synchronized List<String[]> allApps() {
              List<String[]> c = appCache;
              if (c != null) return c;
              PackageManager pm = getPackageManager();
              Map<String, String[]> found = new HashMap<String, String[]>();
              List<String> order = new ArrayList<String>();
              String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
              for (String cat : cats) {
                Intent m = new Intent(Intent.ACTION_MAIN);
                m.addCategory(cat);
                for (ResolveInfo r : pm.queryIntentActivities(m, 0)) {
                  String p = r.activityInfo.packageName;
                  if (p.equals(getPackageName()) || found.containsKey(p)) continue;
                  String lb = r.loadLabel(pm).toString();
                  found.put(p, new String[]{p, lb, r.activityInfo.name, lb.toLowerCase()});
                  order.add(p);
                }
              }
              List<String[]> list = new ArrayList<String[]>();
              for (String p : order) list.add(found.get(p));
              appCache = list;
              return list;
            }

            /* ---------- Ø§Ù„Ø¨Ø­Ø« Ø¹Ù† ØªØ·Ø¨ÙŠÙ‚ Ø¨Ø§Ù„Ø§Ø³Ù… ---------- */
            String[] find(String q) {
              String[] keys = q.toLowerCase().split("\\|");
              for (String[] a : allApps()) {
                for (String k : keys) {
                  if (k.length() > 0 && a[3].contains(k)) return a;
                }
              }
              return null;
            }

            Intent launchIntentFor(String pkg) {
              PackageManager pm = getPackageManager();
              Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
              if (i == null) i = pm.getLaunchIntentForPackage(pkg);
              return i;
            }

            /* ---------- Ø±Ø³Ù… Ø£ÙŠÙ‚ÙˆÙ†Ø© Ø§Ù„ØªØ·Ø¨ÙŠÙ‚ (Ù…Ø±Ø¨Ø¹Ø© Ø¨Ø¯ÙˆÙ† Ù‚Ù†Ø§Ø¹) ---------- */
            byte[] iconBytes(String pkg) {
              byte[] cached = iconCache.get(pkg);
              if (cached != null) return cached;
              try {
                PackageManager pm = getPackageManager();
                Drawable d = pm.getApplicationIcon(pkg);
                int s = 160;
                Bitmap bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                Canvas c = new Canvas(bm);
                if (Build.VERSION.SDK_INT >= 26 && d instanceof AdaptiveIconDrawable) {
                  AdaptiveIconDrawable ad = (AdaptiveIconDrawable) d;
                  int o = s / 4;
                  Drawable bg = ad.getBackground();
                  Drawable fg = ad.getForeground();
                  if (bg != null) { bg.setBounds(-o, -o, s + o, s + o); bg.draw(c); }
                  if (fg != null) { fg.setBounds(-o, -o, s + o, s + o); fg.draw(c); }
                } else {
                  d.setBounds(0, 0, s, s);
                  d.draw(c);
                }
                ByteArrayOutputStream out = new ByteArrayOutputStream();
                bm.compress(Bitmap.CompressFormat.PNG, 100, out);
                byte[] b = out.toByteArray();
                iconCache.put(pkg, b);
                return b;
              } catch (Throwable e) {
                return null;
              }
            }

            /* ---------- Ø§Ù„Ø¬Ø³Ø± Ø¨ÙŠÙ† Ø§Ù„ÙˆØ§Ø¬Ù‡Ø© ÙˆØ£Ù†Ø¯Ø±ÙˆÙŠØ¯ ---------- */
            class Bridge {
              /* ÙŠØ±Ø¬Ù‘Ø¹ Ø§Ø³Ù… Ø§Ù„Ø­Ø²Ù…Ø© Ø¥Ù† ÙƒØ§Ù† Ø§Ù„ØªØ·Ø¨ÙŠÙ‚ Ù…Ø«Ø¨ØªØ§Ù‹ØŒ ÙˆØ¥Ù„Ø§ Ù†Øµ ÙØ§Ø±Øº */
              @JavascriptInterface
              public String resolve(String q) {
                try {
                  if (q.startsWith("pkg:")) {
                    String p = q.substring(4);
                    return launchIntentFor(p) != null ? p : "";
                  }
                  if (q.startsWith("name:")) {
                    String[] r = find(q.substring(5));
                    return r != null ? r[0] : "";
                  }
                } catch (Throwable e) { }
                return "";
              }

              /* Ù‚Ø§Ø¦Ù…Ø© ÙƒÙ„ Ø§Ù„ØªØ·Ø¨ÙŠÙ‚Ø§Øª */
              @JavascriptInterface
              public String apps() {
                JSONArray arr = new JSONArray();
                try {
                  List<String[]> list = new ArrayList<String[]>(allApps());
                  Collections.sort(list, new Comparator<String[]>() {
                    public int compare(String[] a, String[] b) { return a[1].compareToIgnoreCase(b[1]); }
                  });
                  for (String[] e : list) {
                    JSONObject o = new JSONObject();
                    o.put("pkg", e[0]);
                    o.put("label", e[1]);
                    arr.put(o);
                  }
                } catch (Throwable e) { }
                return arr.toString();
              }

              /* Ù…Ù†Ø§ÙØ° HDMI */
              @JavascriptInterface
              public String inputs() {
                JSONArray arr = new JSONArray();
                try {
                  TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                  List<JSONObject> rows = new ArrayList<JSONObject>();
                  Set<String> seen = new HashSet<String>();
                  for (TvInputInfo t : tm.getTvInputList()) {
                    if (t.getType() != TvInputInfo.TYPE_HDMI) continue;
                    if (!seen.add(t.getId())) continue;
                    JSONObject o = new JSONObject();
                    String label = "";
                    try { CharSequence cl = t.loadLabel(MainActivity.this); if (cl != null) label = cl.toString(); } catch (Throwable e) { }
                    int port = 0;
                    String device = "";
                    try {
                      Object h = t.getClass().getMethod("getHdmiDeviceInfo").invoke(t);
                      if (h != null) {
                        port = ((Integer) h.getClass().getMethod("getPortId").invoke(h)).intValue();
                        Object dn = h.getClass().getMethod("getDisplayName").invoke(h);
                        if (dn != null && dn.toString().length() > 0) device = dn.toString();
                      }
                    } catch (Throwable e) { }
                    if (label.length() == 0) label = "HDMI " + (port > 0 ? port : (rows.size() + 1));
                    boolean connected = true;
                    try { connected = tm.getInputState(t.getId()) != TvInputManager.INPUT_STATE_DISCONNECTED; } catch (Throwable e) { }
                    o.put("id", t.getId());
                    o.put("label", label);
                    o.put("device", device);
                    o.put("port", port);
                    o.put("connected", connected);
                    rows.add(o);
                  }
                  Collections.sort(rows, new Comparator<JSONObject>() {
                    public int compare(JSONObject a, JSONObject b) {
                      int d = a.optInt("port") - b.optInt("port");
                      return d != 0 ? d : a.optString("label").compareTo(b.optString("label"));
                    }
                  });
                  for (JSONObject o : rows) arr.put(o);
                } catch (Throwable e) { }
                return arr.toString();
              }

              @JavascriptInterface
              public void launch(final String q) {
                runOnUiThread(new Runnable() { public void run() {
                  try {
                    Intent i = null;
                    if (q.equals("settings")) i = new Intent(Settings.ACTION_SETTINGS);
                    else if (q.startsWith("input:")) i = new Intent(Intent.ACTION_VIEW, TvContract.buildChannelUriForPassthroughInput(q.substring(6)));
                    else if (q.startsWith("pkg:")) i = launchIntentFor(q.substring(4));
                    else if (q.startsWith("name:")) {
                      String[] r = find(q.substring(5));
                      if (r != null) {
                        i = new Intent(Intent.ACTION_MAIN);
                        i.setClassName(r[0], r[2]);
                      }
                    }
                    if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      overridePendingTransition(0, 0);
                    } else Toast.makeText(MainActivity.this, "ØºÙŠØ± Ù…ÙˆØ¬ÙˆØ¯", Toast.LENGTH_SHORT).show();
                  } catch (Throwable e) {
                    Toast.makeText(MainActivity.this, "ØªØ¹Ø°Ø± Ø§Ù„ÙØªØ­", Toast.LENGTH_SHORT).show();
                  }
                }});
              }
            }

            void js(final String code) {
              runOnUiThread(new Runnable() { public void run() {
                if (web != null) web.evaluateJavascript(code, null);
              }});
            }

            void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setMediaPlaybackRequiresUserGesture(false);
              if (Build.VERSION.SDK_INT >= 23) s.setOffscreenPreRaster(true);
              web.setBackgroundColor(0xFF0B0F1A);
              web.setOverScrollMode(View.OVER_SCROLL_NEVER);
              web.setVerticalScrollBarEnabled(false);
              web.setHorizontalScrollBarEnabled(false);
              /* ØªØ­Ø¯ÙŠØ« Ø§Ù„ÙƒØ§Ø´ ÙÙ‚Ø· Ø¹Ù†Ø¯ ØªØ«Ø¨ÙŠØª Ø£Ùˆ Ø­Ø°Ù ØªØ·Ø¨ÙŠÙ‚ */
              IntentFilter pf = new IntentFilter();
              pf.addAction(Intent.ACTION_PACKAGE_ADDED);
              pf.addAction(Intent.ACTION_PACKAGE_REMOVED);
              pf.addAction(Intent.ACTION_PACKAGE_CHANGED);
              pf.addDataScheme("package");
              registerReceiver(new BroadcastReceiver() {
                @Override public void onReceive(Context c, Intent i) {
                  appCache = null; iconCache.evictAll(); pkgDirty = true;
                }
              }, pf);
              web.addJavascriptInterface(new Bridge(), "Android");
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (u != null && "icons.local".equals(u.getHost())) {
                    Map<String, String> h = new HashMap<String, String>();
                    h.put("Access-Control-Allow-Origin", "*");
                    h.put("Cache-Control", "max-age=86400");
                    String pkg = u.getLastPathSegment();
                    byte[] png = pkg == null ? null : iconBytes(pkg);
                    if (png != null) return new WebResourceResponse("image/png", null, 200, "OK", h, new ByteArrayInputStream(png));
                    return new WebResourceResponse("image/png", null, 404, "Not Found", h, new ByteArrayInputStream(new byte[0]));
                  }
                  return null;
                }
              });
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
              immersive();
            }

            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) immersive();
            }

            @Override protected void onResume() {
              super.onResume();
              if (pkgDirty) { pkgDirty = false; js("window.refreshDock&&refreshDock()"); }
            }

            @Override protected void onNewIntent(Intent i) {
              super.onNewIntent(i);
              js("window.goHome&&goHome()");
            }

            @Override public void onBackPressed() {
              js("window.onBackKey&&onBackKey()");
            }
          }
          EOF
          cat > app/src/main/java/com/om/shasha/BootReceiver.java <<'EOF'
          package com.om.shasha;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try {
                Intent l = new Intent(c, MainActivity.class);
                l.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(l);
              } catch (Throwable e) { }
            }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
